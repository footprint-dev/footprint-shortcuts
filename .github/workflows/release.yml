name: Build shortcut release assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate shortcut
        run: python3 build_shortcut.py

      - name: Sign shortcut
        run: python3 sign_shortcut.py

      - uses: actions/upload-artifact@v7
        with:
          name: shortcut-release
          path: upload-location.shortcut
          if-no-files-found: error

  upload:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shortcut-release

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" "upload-location.shortcut" --clobber
